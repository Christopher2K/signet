<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title></title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img class="logo-light" src="images/signet-logo-light.png" alt="" width="32" height="32">
        <img class="logo-dark" src="images/signet-logo-dark.png" alt="" width="32" height="32">
        <div>
          <!-- biome-ignore lint/a11y/useHeadingContent: Populated from the active WebExtension locale. -->
          <h1 data-i18n="popup_title"></h1>
          <p data-i18n="popup_subtitle"></p>
        </div>
      </header>

      <form id="bookmark-form" novalidate>
        <div class="field">
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: Populated from the active WebExtension locale. -->
          <label for="bookmark-title" data-i18n="title_label"></label>
          <input id="bookmark-title" name="title" type="text" required autocomplete="off" aria-describedby="title-error">
          <p id="title-error" class="field-error" hidden></p>
        </div>

        <fieldset class="field">
          <legend id="url-label" class="label" data-i18n="url_label"></legend>
          <p id="bookmark-url" class="url"></p>
        </fieldset>

        <div id="status" class="status" role="status" aria-live="polite">
          <strong id="status-title"></strong>
          <p id="status-message" data-i18n="loading"></p>
        </div>

        <button id="save-button" type="submit" disabled data-i18n="save"></button>
        <button id="open-app-button" type="button" hidden data-i18n="open_app"></button>
      </form>
    </main>
  </body>
</html>
