services:
  web:
    environment:
      SIGNET_FORWARDED_HOST: "${SIGNET_DOMAIN:?Set SIGNET_DOMAIN to the public DNS name in .env}"
      SIGNET_FORWARDED_PORT: "443"
      SIGNET_FORWARDED_PROTO: "https"

  api:
    environment:
      PHX_HOST: "${SIGNET_DOMAIN:?Set SIGNET_DOMAIN to the public DNS name in .env}"
