name: Test and publish container images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - id: release
        name: Detect stable version tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      MIX_ENV: test
      SIGNET_API_DB_HOSTNAME: localhost
      SIGNET_API_DB_PASSWORD: postgres
      SIGNET_API_DB_PORT: "5432"
      SIGNET_API_DB_USERNAME: postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: signet_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d signet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.18.4
          otp-version: "28.1"
      - uses: actions/cache@v4
        with:
          path: |
            apps/api/deps
            apps/api/_build
          key: api-test-${{ runner.os }}-${{ hashFiles('apps/api/mix.lock') }}
          restore-keys: api-test-${{ runner.os }}-
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: mix test

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --filter @signet/web-client... --frozen-lockfile
      - run: pnpm --filter @signet/web-client test
      - run: pnpm --filter @signet/web-client typecheck

  publish:
    if: github.event_name != 'pull_request'
    needs:
      - prepare
      - test-api
      - test-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: signet-api
            dockerfile: apps/api/Dockerfile
          - name: signet-web
            dockerfile: apps/web-client/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase the GHCR namespace
        id: namespace
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: metadata
        name: Generate immutable and release tags
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.namespace.outputs.owner }}/${{ matrix.image.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
